name: Deploy to Vercel (nextjs branch)

on:
  push:
    branches:
      - nextjs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_2nRiIieOZZHQp7iHpj30sho9HL4U/WXBfnSDUp8?target=production"
